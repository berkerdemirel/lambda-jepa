[project]
name = "sslgap"
version = "0.1.0"
description = "Loss Space != Representation Space: a two-space audit of SSL desiderata (h vs z)"
requires-python = ">=3.11"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "timm>=1.0",
    "wandb>=0.21",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "datasets>=3.0",
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "scipy>=1.12",
    "pandas>=2.1",
    "tabulate>=0.9",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sslgap"]

# torch/torchvision from the PyTorch CUDA-13.0 index (mirrors ssl_explore/lejepa venvs
# so their checkpoints load bit-identically).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
