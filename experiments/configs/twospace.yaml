run_id: ???
store_root: /nfs/scistore19/locatgrp/bdemirel/ssl_project/features
results_root: /nfs/scistore19/locatgrp/bdemirel/ssl_project/results
manifest: null            # default: every .o<V> manifest of the run
holdout: 0.5              # held-out source fraction (D-100: both splits reported)
floor_frac: 1e-3          # B-support eigenvalue truncation, relative to top
h_layers: false           # also treat per-layer h taps (…h.*.LNN) as h spaces
z_primary: null           # organization z anchor; default *.z.proj.out
do_mlp: false             # MLP center predictor for the Ĝ tightening (needs GPU/torch)
max_n: null               # cap sources (consistent subsample across spaces)
max_tap_d: null           # skip taps wider than this (byol 4096-d hidden-tap wall)
seed: 0

hydra:
  run:
    dir: outputs/hydra/${hydra.job.name}/${now:%Y%m%d_%H%M%S}
