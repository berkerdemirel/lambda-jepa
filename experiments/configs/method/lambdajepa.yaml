name: lambdajepa
# The house method (E19-T2 lineage): MSE alignment + moment floor as sole anti-collapse at z
# + calibrated moment floor at declared h (cls). Doses = the v2 recipe (E19 card arm 6):
# w_floor by z-duty matching, h_lamb by the E19-T1 share rule. head_norm: bn = vicreg's
# expander verbatim (byte-matched migration) | none = the BN-free conduit head (E21).
w_inv: 25.0
w_floor: 45.0
h_lamb: 0.65
z_floor_batch: pooled  # pooled = floor the bs*V batch (aug variance pays) | view_mean = floor per-image view means (payment /V; D-051)
z_d_slice: null    # z-floor slice width; null -> min(128, expander_dim). REQUIRED co-design under view_mean: n drops to bs, keep n/d' >= 4 (32 at bs=128)
h_floor_batch: pooled  # pooled = floor all bs*V view CLS (E20-certified regime) | view_mean = per-image mean CLS (D-058 vm3, symmetric payment with z)
h_d_slice: null    # h-floor slice width; null -> 128. Same co-design under view_mean: 32 at bs=128 (first-32 sub-frame of the 128-draw)
queue_steps: 0     # D-064: detached ring of last k conditioner inputs (vm4 "matched vm3": 3 -> n=512, d_slice 128 restored); 0 = off, byte-identical legacy path
h_queue_steps: null # D-079a: h-tap ring length when d'_h outgrows 128 (B: 7, L: 11 -> n_eff/d' = 4 at bs=128); null = queue_steps (byte-identical legacy). OAS = sanctioned B/L fallback on ring staleness.
cond_stream: null  # D-084 (multicrop only): null/"all" = conditioner reads the mean over ALL views (legacy, byte-identical) | "globals" = mean over the Vg globals only (D-086: kills the aug axis — retired for E27 cells) | "grouped" (D-087 PROPOSED, wave 4) = TWO scale-homogeneous streams (global-mean + local-mean), one KL each averaged, own ring per group — locals stay conditioner-visible without cross-scale mixing. inv keeps every view in all modes
Vg: 2              # D-079a multicrop (aug=lejepa_mc): global views @ frame img_size
Vl: 8              # local views @ local_size
local_size: 96
global_scale: [0.3, 1.0]   # LeJEPA-repo-published geometry (README; D-082 recheck). e27slg overrides local_scale=[0.7,1.0]
local_scale: [0.05, 0.3]   # locals @96 = the /16 adaptation of their 98 (/14-friendly)
floor_shrink: null # D-073: "oas" = fresh-batch OAS shrinkage toward mI inside BOTH conditioners (the no-ring estimator; rho detached, m live); null = legacy exact scatter
expander_hidden: 2048
expander_dim: 2048
head_norm: bn
head_layers: null  # E23 rev3: legacy-anatomy ladder — K hidden BN-ReLU layers ((2, width=hidden) ≡ the bn expander byte-identically; 0 = bare linear projector); null = legacy expander
head_width: null   # E23 rev3: middle-layer width, the fine capacity dial (null = expander_hidden)
mlp_wd: null       # E23 (D-067): separate projector weight decay (own param group); null = legacy single group
grad_ckpt: false   # trunk activation checkpointing (memory for ~30% compute, same math; e24v3nq bs=512 fit)
drop_path: 0.1
lr: 1e-3
wd: 5e-2
warmup_ep: 10
eta_min: 1e-5
