name: floorssl
# The house method (E19-T2 lineage): MSE alignment + moment floor as sole anti-collapse at z
# + calibrated moment floor at declared h (cls). Doses = the v2 recipe (E19 card arm 6):
# w_floor by z-duty matching, h_lamb by the E19-T1 share rule. head_norm: bn = vicreg's
# expander verbatim (byte-matched migration) | none = the BN-free conduit head (E21).
w_inv: 25.0
w_floor: 45.0
h_lamb: 0.65
z_floor: kl        # kl = symmetric MomentFloor (Sigma=I) | hinge = one-sided HingeFloor (Sigma>=I, D-049)
z_floor_batch: pooled  # pooled = floor the bs*V batch (aug variance pays) | view_mean = floor per-image view means (payment /V; D-051)
z_d_slice: null    # z-floor slice width; null -> min(128, expander_dim). REQUIRED co-design under view_mean: n drops to bs, keep n/d' >= 4 (32 at bs=128)
h_floor_batch: pooled  # pooled = floor all bs*V view CLS (E20-certified regime) | view_mean = per-image mean CLS (D-058 vm3, symmetric payment with z)
h_d_slice: null    # h-floor slice width; null -> 128. Same co-design under view_mean: 32 at bs=128 (first-32 sub-frame of the 128-draw)
expander_hidden: 2048
expander_dim: 2048
head_norm: bn
drop_path: 0.1
lr: 1e-3
wd: 5e-2
warmup_ep: 10
eta_min: 1e-5
