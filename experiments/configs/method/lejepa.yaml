name: lejepa
# EXACT official minimal recipe (../lejepa, D-011): single hyperparameter lambda; no heuristics.
lamb: 0.02
V: 4
proj_dim: 16
emb_dim: 512
drop_path: 0.1
lr: 2e-3
wd: 5e-2
warmup_ep: 1
eta_min: 1e-3              # official (= lr/2; deliberately violates the house eta_min<=lr/20 — D-011)
grad_clip: null            # official: NO gradient clipping (D-011 port-exact override of the frame default)
# D-082 multicrop control (Recipe v2): aug=lejepa_mc switches to the shared multicrop dataset
# (repo-published geometry; identical to the floorssl lanes). The control cell overrides
# lamb=0.05 lr=5e-4 eta_min=5e-7 (repo README large-scale values: lr "good starting point",
# final lr = initial/1000; λ from the paper recommendation).
Vg: 2
Vl: 8
local_size: 96
global_scale: [0.3, 1.0]
local_scale: [0.05, 0.3]
